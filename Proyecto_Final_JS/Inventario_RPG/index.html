<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inventario RPG Clásico</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background-color: #1e1e1e; color: #d4d4d4; }
        h2 { color: #f1c40f; text-align: center; border-bottom: 2px dashed #555; padding-bottom: 10px; }
        h3 { color: #e67e22; }
        
        .contenedor { display: flex; gap: 20px; max-width: 900px; margin: 0 auto; }
        .panel { border: 2px solid #555; padding: 20px; width: 50%; background: #2d2d2d; border-radius: 5px; }
        
        .stat { font-weight: bold; font-size: 1.2em; }
        .stat-vida { color: #e74c3c; }
        .stat-ataque { color: #3498db; }
        .stat-defensa { color: #2ecc71; }
        
        input, select { width: 95%; padding: 8px; margin-bottom: 10px; background: #1e1e1e; color: white; border: 1px solid #777; }
        .boton { background-color: #8e44ad; color: white; border: none; padding: 10px; width: 100%; cursor: pointer; font-weight: bold; border-radius: 3px; }
        .boton:hover { background-color: #9b59b6; }
        
        .filtros { margin-bottom: 15px; display: flex; gap: 5px; }
        .btn-filtro { background-color: #34495e; color: white; border: none; padding: 5px 10px; cursor: pointer; flex: 1; }
        
        ul { list-style: none; padding: 0; }
        li { background: #3a3a3a; margin-bottom: 15px; padding: 15px; border-left: 4px solid #f1c40f; position: relative; }
        .equipado { color: #f1c40f; font-weight: bold; }
        
        .btn-accion { background: #27ae60; color: white; border: none; padding: 5px 10px; cursor: pointer; margin-top: 10px; }
        .btn-tirar { background: #c0392b; color: white; border: none; padding: 5px 10px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <h2>⚔️ Gestor de Inventario RPG 🛡️</h2>
    
    <div class="contenedor">
        <!-- PANEL IZQUIERDO: STATS Y CREACIÓN -->
        <div class="panel">
            <h3>Estadísticas del Héroe</h3>
            <p>Salud Máxima: <span class="stat stat-vida" id="totalVida">100</span></p>
            <p>Poder de Ataque: <span class="stat stat-ataque" id="totalAtaque">10</span></p>
            <p>Nivel de Defensa: <span class="stat stat-defensa" id="totalDefensa">10</span></p>
            
            <hr style="border-color: #555; margin: 20px 0;">
            
            <h3>Forjar / Encontrar Objeto</h3>
            <input type="text" id="nuevoNombre" placeholder="Nombre (Ej: Anillo Maldito del Rey)">
            <select id="nuevoTipo">
                <option value="arma">Arma (Equipables: 2)</option>
                <option value="armadura">Armadura/Ropa (Equipables: 1)</option>
                <option value="accesorio">Accesorio/Reliquia (Equipables: 2)</option>
            </select>
            
            <p style="margin-bottom: 5px; font-size: 0.9em;">Modificadores (pueden ser negativos):</p>
            <input type="number" id="modVida" placeholder="Modificador de Vida (Ej: -20)">
            <input type="number" id="modAtaque" placeholder="Modificador de Ataque (Ej: 15)">
            <input type="number" id="modDefensa" placeholder="Modificador de Defensa (Ej: 0)">
            
            <button class="boton" onclick="agregarObjeto()">Añadir a la Mochila</button>
        </div>

        <!-- PANEL DERECHO: MOCHILA -->
        <div class="panel">
            <h3>Mochila de Viaje (<span id="cantidadMochila">0</span>/10)</h3>
            <div class="filtros">
                <button class="btn-filtro" onclick="mostrarInventario('todos')">Todo</button>
                <button class="btn-filtro" onclick="mostrarInventario('arma')">Armas</button>
                <button class="btn-filtro" onclick="mostrarInventario('armadura')">Armaduras</button>
                <button class="btn-filtro" onclick="mostrarInventario('accesorio')">Accesorios</button>
            </div>
            
            <ul id="listaObjetos"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
